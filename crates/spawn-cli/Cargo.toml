[package]
name = "spawn-cli"
description = "The spawn binary: assembly of the stores, the host and the bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spawn"
path = "src/main.rs"

[dependencies]
spawn-core.workspace = true
spawn-postgres.workspace = true
spawn-host.workspace = true
spawn-jev.workspace = true
# The code graph behind `spawn features graph` (issue #100).
spawn-codegraph.workspace = true
# spawn-node v1's protocol: `scenarios_sha256` is its `tree_sha256_v1`.
spawn-node-proto.workspace = true
# Data snapshots (PV3b): manifest-v1, the `data` namespace and its pins.
spawn-cas.workspace = true
serde.workspace = true
serde_json.workspace = true
# The backups' sha256, computed as a record spells it.
sha2.workspace = true
# The secrets' keyed fingerprint (objective 123).
hmac.workspace = true
# The scratch sweep removes the very directories it judged, from file
# descriptors (objective 145).
rustix.workspace = true
tiny_http = "0.12.0"
# SIGTERM ends `spawn loop` between passes, so its pending pushes are made.
signal-hook = { version = "0.3", default-features = false }
# Randomness (`commands/queue.rs`, `nodes/v1.rs`), secret zeroization
# (`serve/ipc`) and base64 (`serve/ipc/node.rs`).
ring.workspace = true
zeroize.workspace = true
base64.workspace = true

[lints]
workspace = true

[dev-dependencies]
postgres.workspace = true
spawn-host = { workspace = true, features = ["testing"] }
spawn-postgres = { workspace = true, features = ["testing"] }
# The in-memory terminal host, under a real Bridge in the dispatcher's tests.
spawn-core = { workspace = true, features = ["testing"] }
