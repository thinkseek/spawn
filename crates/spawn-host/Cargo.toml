[package]
name = "spawn-host"
description = "Host adapters for Spawn: tmux terminals, git workspaces and the transcript archive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spawn-core.workspace = true
libc.workspace = true
rustix.workspace = true
serde_json.workspace = true
# Content addresses of deduplicated build artifacts (`cas_dedup`); already
# linked through the PostgreSQL driver's SCRAM login.
sha2.workspace = true

[features]
# The git a test runs for itself (`test_git_command`), for tests only.
testing = []

[dev-dependencies]
spawn-core = { workspace = true, features = ["testing"] }
spawn-host = { path = ".", features = ["testing"] }
spawn-postgres.workspace = true

[lints]
workspace = true
