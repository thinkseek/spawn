[workspace]
resolver = "3"
members = [
    "crates/spawn-core",
    "crates/spawn-postgres",
    "crates/spawn-jev",
    "crates/spawn-host",
    "crates/spawn-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/acupof-ai/Spawn"

[workspace.dependencies]
spawn-core = { path = "crates/spawn-core" }
spawn-postgres = { path = "crates/spawn-postgres" }
spawn-jev = { path = "crates/spawn-jev" }
spawn-host = { path = "crates/spawn-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Blocking client: Spawn has no async code path, so no runtime is linked.
postgres = { version = "0.19", default-features = false, features = ["with-serde_json-1"] }
# Already linked through the driver's SCRAM login; derives the role passwords.
sha2 = "0.11"
# Already linked through std's dependencies; opens agent-written files with
# O_NOFOLLOW | O_NONBLOCK.
libc = "0.2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# SCRAM-SHA-256 login runs 4096 PBKDF2 rounds; unoptimized sha2 makes every
# PostgreSQL connect take ~50 ms instead of ~5 ms.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.postgres-protocol]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
