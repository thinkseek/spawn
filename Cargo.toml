[workspace]
resolver = "3"
members = [
    "crates/spawn-types",
    "crates/spawn-process",
    "crates/spawn-store",
    "crates/spawn-store-postgres",
    "crates/spawn-engine",
    "crates/spawn-layerfs",
    "crates/spawn-terminal",
    "crates/spawn-bridge",
    "crates/spawn-observer",
    "crates/spawn-judge-jev",
    "crates/spawn-projector",
    "crates/spawn-gateway",
    "crates/spawn-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/acupof-ai/Spawn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

# Smaller and faster test/dev builds while keeping release optimization.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"
incremental = true

[profile.test]
inherits = "dev"
debug = "line-tables-only"
opt-level = 1

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
