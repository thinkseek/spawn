[workspace]
resolver = "3"
members = [
    "crates/spawn-core",
    "crates/spawn-postgres",
    "crates/spawn-jev",
    "crates/spawn-host",
    "crates/spawn-cas",
    "crates/spawn-cli",
    "crates/spawn-kdf",
    "crates/spawn-codegraph",
    "crates/spawn-node-proto",
    "crates/spawn-node-gateway",
    "crates/ghostty-vt",
    "crates/spawn-hc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/acupof-ai/Spawn"

[workspace.dependencies]
spawn-core = { path = "crates/spawn-core" }
spawn-postgres = { path = "crates/spawn-postgres" }
spawn-jev = { path = "crates/spawn-jev" }
spawn-host = { path = "crates/spawn-host" }
spawn-cas = { path = "crates/spawn-cas" }
spawn-kdf = { path = "crates/spawn-kdf" }
spawn-codegraph = { path = "crates/spawn-codegraph" }
spawn-node-proto = { path = "crates/spawn-node-proto" }
# Isolated in `crates/spawn-hc` (`spawn` invokes it out-of-process, keeping `spawn` free of async/CLI crates).
herdr-core = { git = "https://github.com/herdrdev/herdr-core", rev = "329cb66ebce5eca3d917fcf7364a099046979b49" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Blocking client: Spawn has no async code path, so no runtime is linked.
postgres = { version = "0.19", default-features = false, features = ["with-serde_json-1"] }
postgres-protocol = { version = "0.6", default-features = false }
# Already linked through the driver; its fallible iterators are how the
# `LISTEN spawn_events` connection waits for a notification with a timeout.
fallible-iterator = "0.2"
# Already linked through the driver's SCRAM login; derive the role passwords
# (PBKDF2-HMAC-SHA256).
sha2 = "0.11"
hmac = "0.13"
# Already linked through std's dependencies; opens agent-written files with
# O_NOFOLLOW | O_NONBLOCK.
libc = "0.2"
# Descriptor-relative file calls (openat, mkdirat, renameat) without
# unsafe code: files an agent can write are opened inside the workspace only.
# `use-libc-auxv` avoids reading `/proc/self/auxv` when `PR_SET_DUMPABLE=0`
# makes it unreadable on Linux 5.4 (`undumpable()`).
rustix = { version = "1", features = ["event", "fs", "net", "param", "process", "use-libc-auxv"] }
# Ed25519 signing/randomness (`spawn-node-proto`, `spawn-node-gateway`, `spawn-cli`),
# secret zeroization (`zeroize`), base64 (`base64`), and Git SHA-1 object IDs (`spawn-cas`).
ring = "0.17"
zeroize = "1"
base64 = "0.22"
sha1 = "0.11"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# SCRAM-SHA-256 login runs 4096 PBKDF2 rounds; unoptimized sha2 makes every
# PostgreSQL connect take ~50 ms instead of ~5 ms.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.postgres-protocol]
opt-level = 3

# The restricted logins' 600 000 PBKDF2 rounds (crates/spawn-kdf): about
# 1 s per login unoptimised, the floor of every database test binary.
[profile.dev.package.spawn-kdf]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[patch."https://github.com/herdrdev/herdr-core"]
ghostty-vt = { path = "crates/ghostty-vt" }
