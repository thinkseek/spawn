<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Spawn</title>
    <script>
      /* The theme before the first paint (src/theme.ts keeps it current):
         the stored choice, or the system's scheme. */
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("spawn.theme") || "system";
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
